server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name _;

  ssl_certificate /secret/cert.pem;
  ssl_certificate_key /secret/key.pem;
}

server {
  listen 80;
  listen [::]:80;

  return 307 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name tpvpa.terraria.sh;

  location / {
    add_header Content-Type text/plain;
    return 200 "hello.";
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name dev.api.tpvpa.terraria.sh;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
