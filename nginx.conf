server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name _;

  ssl_certificate /secret/cert.pem;
  ssl_certificate_key /secret/key.pem;
}

server {
  listen 80;
  listen [::]:80;

  return 307 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name tpvpa.terraria.sh;

  location / {
    add_header Content-Type text/plain;
    return 200 "hello.";
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name dev.api.tpvpa.terraria.sh;

  ssl_client_certificate /secret/client_ca.crt;
  ssl_verify_client optional;

  location / {
    proxy_pass http://127.0.0.1:8080;

    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Official-Verified $ssl_client_verify;
    proxy_set_header Official-Identity-Subject $ssl_client_s_dn;
    proxy_set_header Official-Identity-Fingerprint $ssl_client_fingerprint;
  }
}
